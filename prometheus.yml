global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'flask-app'
    static_configs:
      # 'app' es el nombre del servicio en docker-compose.yml; Prometheus
      # y la app comparten la misma red de Docker, por lo que se resuelven
      # por nombre de servicio (más fiable que 'localhost' entre contenedores).
      - targets: ['app:5000']
